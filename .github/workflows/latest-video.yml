# 公開リポジトリ側の .github/workflows/latest-video.yml に置くファイル。
#
# 何をするか:
#   YouTubeの「動画」タブ(https://www.youtube.com/@pesu_/videos)のHTMLを取得し、
#   一番上の動画のIDとタイトルを latest.json に書き込んでコミットする。
#   Shortsは別タブなので「動画」タブからは本編だけが取れる（切り抜きの混入を防ぐ）。
#   あわせて index.html の og:image も同じサムネURLに書き換えるので、
#   SNSにURLを貼ったときのサムネが常に最新曲になる（ogp.png を用意しなくていい）。
#   さらに YouTubeチャンネルのアイコンを icon.png / icon.jpg として保存するので、
#   プロフィール画像も手で用意しなくていい（AUTO_ICON: "false" で止められる）。
#   拡張子は中身の先頭バイトから判定し、index.html の参照もあわせて書き換える。
#   取得や解析に失敗したときは latest.json を書き換えずにジョブを失敗させる。
#   → サイトは前回の内容のまま生き続け、GitHubから失敗通知メールが届く。
#
# YouTubeのHTML構造について:
#   YouTubeは動画一覧の表現を videoRenderer から lockupViewModel へ移行させており、
#   どちらが返ってくるかは時期やA/Bテストで変わる。両方に対応させ、
#   どちらでも拾えなかったときは中身のレンダラー種別を一覧で出力して、
#   次に何を対応すべきかがログだけで分かるようにしている。

name: 最新曲を取得

on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = JST 翌6:00
  workflow_dispatch: # Actionsタブから手動実行するためのボタン

permissions:
  contents: write

concurrency:
  group: latest-video
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 最新曲とチャンネルアイコンを取得して反映する
        env:
          CHANNEL_URL: https://www.youtube.com/@pesu_/videos
          # YouTubeのチャンネルアイコンを自動で同期する。
          # 別のアイコンを手動で使いたくなったら "false" にする。
          AUTO_ICON: "true"
        run: |
          python3 - <<'PY'
          import collections, json, os, re, sys, urllib.request, datetime

          URL = os.environ["CHANNEL_URL"]
          AUTO_ICON = os.environ.get("AUTO_ICON", "true").lower() == "true"
          OUT = "latest.json"
          HTML = "index.html"
          # 保存名は中身に合わせて決める（YouTubeはJPEGを返すこともPNGを返すこともある）
          ICON_NAMES = ("icon.png", "icon.jpg", "icon.webp")

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 (KHTML, like Gecko) "
                "Chrome/125.0 Safari/537.36")

          def fetch_bytes(url, timeout=30):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept-Language": "ja,en;q=0.8",
                  # EU圏のランナーに割り当てられたときの同意ページを回避する
                  "Cookie": "CONSENT=YES+cb; SOCS=CAI",
              })
              with urllib.request.urlopen(req, timeout=timeout) as res:
                  return res.read()

          def fetch(url):
              return fetch_bytes(url).decode("utf-8", "replace")

          def icon_name(data):
              """中身の先頭バイトから、正しい拡張子のファイル名を決める。
              JPEGを icon.png という名前で置くとContent-Typeが実体と食い違うため。"""
              if data.startswith(b"\x89PNG"):
                  return "icon.png"
              if data.startswith(b"\xff\xd8"):
                  return "icon.jpg"
              if data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  return "icon.webp"
              return None

          def sync_icon(html):
              """チャンネルページの og:image はチャンネルアイコン。
              これを保存し、プロフィール画像を手動管理から外す。
              失敗しても既存のアイコンはそのままにして、処理は続ける。"""
              if not AUTO_ICON:
                  return
              m = re.search(r'<meta property="og:image" content="([^"]+)"', html)
              if not m:
                  print("チャンネルアイコンのURLが見つかりません。アイコンは据え置きます。")
                  return
              # yt3.googleusercontent.com/...=s160-c-k-... のサイズ指定を大きくする
              url = re.sub(r"=s\d+", "=s512", m.group(1))
              try:
                  data = fetch_bytes(url)
              except Exception as e:
                  print(f"チャンネルアイコンを取得できませんでした: {e}")
                  return

              target = icon_name(data)
              if len(data) < 1000 or target is None:
                  print("取得したデータが画像として不正なので無視します。")
                  return

              try:
                  with open(target, "rb") as f:
                      if f.read() == data:
                          print("アイコンは変更なし")
                          return
              except OSError:
                  pass

              with open(target, "wb") as f:
                  f.write(data)
              # 前回と拡張子が変わったときに古いファイルが残らないようにする
              for other in ICON_NAMES:
                  if other != target and os.path.exists(other):
                      os.remove(other)
                      print(f"古い {other} を削除")

              # index.html 側の参照（favicon・apple-touch-icon・アバター）も合わせる
              with open(HTML, encoding="utf-8") as f:
                  src = f.read()
              patched = re.sub(r"\bicon\.(?:png|jpe?g|webp)\b", target, src)
              if patched != src:
                  with open(HTML, "w", encoding="utf-8") as f:
                      f.write(patched)
                  print(f"index.html の参照を {target} に更新")

              print(f"アイコンを更新: {url} ({len(data)} bytes → {target})")

          def extract_json(html, marker):
              """marker の直後から始まる JSON オブジェクトを、括弧を数えて切り出す。
              正規表現だと入れ子や文字列内の } を誤認するため手で走査する。"""
              i = html.find(marker)
              if i < 0:
                  return None
              i = html.find("{", i)
              if i < 0:
                  return None
              depth, in_str, esc = 0, False, False
              for j in range(i, len(html)):
                  c = html[j]
                  if in_str:
                      if esc:      esc = False
                      elif c == "\\": esc = True
                      elif c == '"': in_str = False
                      continue
                  if c == '"':   in_str = True
                  elif c == "{": depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          try:
                              return json.loads(html[i:j + 1])
                          except json.JSONDecodeError as e:
                              sys.exit(f"ytInitialData のJSON解析に失敗: {e}")
              return None

          # 動画1件を表しうるキー。YouTubeは新しい lockupViewModel へ移行中で、
          # 時期によってどちらが返るか変わるため両方を見る。
          ITEM_KEYS = ("videoRenderer", "gridVideoRenderer", "lockupViewModel")

          def walk_items(node):
              """動画1件ぶんのノードを、ページに出てくる順（＝新しい順）に取り出す"""
              if isinstance(node, dict):
                  for key in ITEM_KEYS:
                      v = node.get(key)
                      if isinstance(v, dict):
                          yield key, v
                  for v in node.values():
                      yield from walk_items(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from walk_items(v)

          def text_of(t):
              if not isinstance(t, dict):
                  return ""
              if t.get("simpleText"):
                  return t["simpleText"]
              if t.get("content"):
                  return t["content"]
              return "".join(r.get("text", "") for r in t.get("runs") or [])

          def parse_item(kind, node):
              """(videoId, title) を返す。動画として扱えないものは None を返す。"""
              if kind == "lockupViewModel":
                  ctype = node.get("contentType") or ""
                  # 明示的に動画以外（Shorts・プレイリスト等）と分かるものは捨てる
                  if ctype and "VIDEO" not in ctype:
                      return None
                  vid = node.get("contentId")
                  title = text_of(
                      (node.get("metadata") or {})
                      .get("lockupMetadataViewModel", {})
                      .get("title"))
              else:
                  vid = node.get("videoId")
                  title = text_of(node.get("title"))
                  blob = json.dumps(node.get("thumbnailOverlays", []), ensure_ascii=False)
                  nav = json.dumps(node.get("navigationEndpoint", {}))
                  if "SHORTS" in blob or "reelWatch" in nav:
                      return None

              if not vid or not title:
                  return None
              if re.search(r"#shorts?\b", title, re.I):
                  return None
              return vid, title.strip()

          def selected_tab(data):
              """「動画」タブ（選択中のタブ）の中身だけに絞る。
              絞れなかった場合はページ全体を対象にフォールバックする。"""
              tabs = (data.get("contents", {})
                          .get("twoColumnBrowseResultsRenderer", {})
                          .get("tabs", []))
              for tab in tabs:
                  r = tab.get("tabRenderer") or {}
                  if r.get("selected") and r.get("content"):
                      return r["content"]
              return data

          def dump_structure(scope, data):
              """拾えなかったときに、次に何へ対応すべきかをログだけで判断できるようにする"""
              counts = collections.Counter()

              def count(n):
                  if isinstance(n, dict):
                      for k, v in n.items():
                          if k.endswith(("Renderer", "ViewModel")):
                              counts[k] += 1
                          count(v)
                  elif isinstance(n, list):
                      for v in n:
                          count(v)

              count(scope)
              print("--- 選択タブ内のレンダラー種別（上位25件）---")
              for k, c in counts.most_common(25):
                  print(f"    {k}: {c}")
              ids = re.findall(r'"(?:videoId|contentId)":"([\w-]{11})"', json.dumps(data))
              print(f"--- ページ全体の videoId/contentId 先頭5件（全{len(ids)}件）---")
              for v in ids[:5]:
                  print(f"    {v}")

          html = fetch(URL)
          sync_icon(html)   # 最新曲の取得結果に関係なく、アイコンは毎回そろえる

          data = extract_json(html, "ytInitialData")
          if data is None:
              sys.exit("ytInitialData が見つかりませんでした。YouTube側のHTML構造が変わった可能性があります。")

          scope = selected_tab(data)
          picked = None
          for kind, node in walk_items(scope):
              got = parse_item(kind, node)
              if got:
                  picked = {"videoId": got[0], "title": got[1], "via": kind}
                  break

          if picked is None:
              dump_structure(scope, data)
              sys.exit("動画タブから本編動画を1件も取り出せませんでした。")

          print(f"取得元レンダラー: {picked['via']}")

          def thumb_url(vid):
              """maxresdefault が無い動画があるので、実在するほうを選ぶ"""
              maxres = f"https://i.ytimg.com/vi/{vid}/maxresdefault.jpg"
              try:
                  req = urllib.request.Request(maxres, method="HEAD",
                                               headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=15) as res:
                      if res.status == 200:
                          return maxres
              except Exception as e:
                  print(f"maxresdefault が取れないので hqdefault を使う: {e}")
              return f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"

          new = {
              "videoId": picked["videoId"],
              "title": picked["title"],
              "url": f"https://www.youtube.com/watch?v={picked['videoId']}",
              "thumb": thumb_url(picked["videoId"]),
              "updatedAt": datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }

          try:
              with open(OUT, encoding="utf-8") as f:
                  old = json.load(f)
          except (OSError, json.JSONDecodeError):
              old = {}

          if (old.get("videoId") == new["videoId"]
                  and old.get("title") == new["title"]
                  and old.get("thumb") == new["thumb"]):
              print(f"変更なし: {new['title']}")
              sys.exit(0)

          with open(OUT, "w", encoding="utf-8") as f:
              json.dump(new, f, ensure_ascii=False, indent=2)
              f.write("\n")

          # SNS共有用のサムネ(og:image)も最新曲のサムネに差し替える
          with open(HTML, encoding="utf-8") as f:
              html_src = f.read()
          patched, n = re.subn(
              r'(<meta property="og:image" content=")[^"]*(">)',
              lambda m: m.group(1) + new["thumb"] + m.group(2),
              html_src,
          )
          if n == 0:
              sys.exit("index.html に og:image のメタタグが見つかりませんでした。")
          if patched != html_src:
              with open(HTML, "w", encoding="utf-8") as f:
                  f.write(patched)

          print(f"更新: {new['title']} ({new['videoId']})")
          PY

      # 前の手順が失敗しても実行する。最新曲の解析に失敗しても、
      # 取得できたアイコンだけは反映しておきたいため。
      - name: 変更があればコミットする
        if: always()
        run: |
          set -euo pipefail
          # git status なら「変更あり」も「新規ファイル」も同じ判定で拾える
          # アイコンの拡張子が変わることがあるので、パスを列挙せず作業ツリー全体を見る。
          # このリポジトリでワークフローが触るのは latest.json / index.html / icon.* だけ。
          if [ -z "$(git status --porcelain)" ]; then
            echo "コミットするものはありません"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "最新曲とアイコンを更新"
          git push
